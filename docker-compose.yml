services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-red_envelope}
      POSTGRES_USER: ${POSTGRES_USER:-red_envelope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-red_envelope}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-red_envelope} -d ${POSTGRES_DB:-red_envelope}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-red_envelope}:${POSTGRES_PASSWORD:-red_envelope}@postgres:5432/${POSTGRES_DB:-red_envelope}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4000:4000"]
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    ports: ["5173:80"]
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    ports: ["5174:80"]
volumes:
  postgres_data:
  redis_data:
