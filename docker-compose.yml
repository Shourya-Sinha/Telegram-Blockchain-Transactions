version: "3.8"
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - tbt-mongo:/data/db
  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: ./server/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/tbt_chain
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongo
  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
volumes:
  tbt-mongo:
